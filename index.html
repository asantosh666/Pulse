<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PULSE — bare-hand rhythm boxing</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #04050a;
    font-family: system-ui, -apple-system, sans-serif; }
  #app { position: fixed; inset: 0; }
  #enter { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; background: radial-gradient(ellipse at 50% 40%, #0b1024 0%, #04050a 70%);
    color: #eef1ff; z-index: 10; cursor: pointer; text-align: center; padding: 24px; }
  #enter.hidden { display: none; }
  #enter h1 { margin: 0; font-size: 52px; letter-spacing: 14px; font-weight: 800;
    background: linear-gradient(180deg, #ffd27f, #ff9d5c); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  #enter p { margin: 0; font-size: 17px; opacity: 0.75; max-width: 520px; line-height: 1.5; }
  #enter .tap { font-size: 20px; font-weight: 700; letter-spacing: 2px; opacity: 0.95;
    border: 1px solid rgba(255,210,127,0.5); border-radius: 999px; padding: 12px 34px; }
  #status { position: fixed; left: 12px; bottom: 10px; color: #fff; font-size: 20px; z-index: 11;
    background: rgba(0,0,0,.78); padding: 10px 14px; border-radius: 8px; max-width: 92vw;
    max-width: 70vw; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="enter">
  <h1>PULSE</h1>
  <p>Bare-hand rhythm boxing. No controllers — your fists are the controllers.<br>
  Punch the incoming orbs on the beat. Gold = right hand, teal = left.</p>
  <div class="tap">TAP TO ENTER</div>
  <p style="font-size:13px">Best in the Quest browser with hand tracking enabled.<br>
  Week-1 validation spike: 3 rounds &times; 45s at 100 / 110 / 120 BPM.</p>
</div>
<div id="status"></div>
<script type="module" src="js/main.js?v=6"></script>
<script>
// Plain (non-module) diagnostic: runs even if the game module fails to load.
// v6: net-checks every file the game needs, bypassing cache, and reports.
window.addEventListener('DOMContentLoaded', () => {
  const status = document.getElementById('status');
  const btn = document.querySelector('#enter .tap');
  const results = [];
  const render = () => { if (status) status.textContent = 'v6 net: ' + (results.join(' ') || 'checking…'); };
  render();
  [
    ['main', 'js/main.js?v=6'],
    ['audio', 'js/audio.js'],
    ['hands', 'js/hands.js'],
    ['visuals', 'js/visuals.js'],
    ['three', 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'],
  ].forEach(([k, u]) => {
    fetch(u, {cache: 'no-store'}).then(r => { results.push(k + ':' + r.status); render(); })
      .catch(() => { results.push(k + ':FAIL'); render(); });
  });
  setTimeout(() => { if (window.__pulse_booted && status) status.textContent = ''; }, 8000);
  document.getElementById('enter').addEventListener('click', () => {
    if (!window.__pulse_entered) {
      if (btn) btn.textContent = 'TAP REGISTERED…';
      render();
    }
  });
});
</script>
</body>
</html>
